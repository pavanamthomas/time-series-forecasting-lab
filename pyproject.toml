[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsforecast"
version = "0.1.0"
description = "Reproducible time-series modelling, forecasting, diagnostics, rolling validation, and volatility analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
maintainers = [
    { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
keywords = [
    "time-series",
    "forecasting",
    "ARIMA",
    "exponential-smoothing",
    "GARCH",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/pavanamthomas/time-series-forecasting-lab"
Related-Finance = "https://github.com/pavanamthomas/quantitative-finance-models"
Related-Statistics = "https://github.com/pavanamthomas/statistical-reasoning-validation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning",
    "ignore::statsmodels.tools.sm_exceptions.HessianInversionWarning",
    "ignore::UserWarning",
]

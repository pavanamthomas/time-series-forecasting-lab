name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Generate figures and tables
        run: python scripts/run_all.py
